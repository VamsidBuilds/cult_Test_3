CONFIG_ZMK_KEYBOARD_NAME="cult"

# ── RGB — SK6812 + WS2812B on SPI3, 25 LEDs total ──────────────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# ── Encoder ─────────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── BLE + USB ────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ── Debounce ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ── Sleep ────────────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── OLED Display (SSD1306 128×32 via I2C) ────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y

# Built-in status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Run UI updates on system thread (saves RAM)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y

# Blank OLED when idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ── Built-in widgets ─────────────────────────────────────────────────────────
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# ── RAM: give enough heap ────────────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=8192