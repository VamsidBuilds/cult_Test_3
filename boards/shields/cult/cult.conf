CONFIG_ZMK_KEYBOARD_NAME="cult"

# ── RGB — SK6812 + WS2812B on SPI3, 25 LEDs total ──────────────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# ── Encoder ─────────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── BLE + USB ────────────────────────────────────────────────────────────────
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ── Debounce ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ── Sleep ────────────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ── OLED Display (SSD1306 128×32 via I2C) ────────────────────────────────────
CONFIG_ZMK_DISPLAY=y                            # master display switch
CONFIG_SSD1306=y                                # Zephyr SSD1306 driver
CONFIG_I2C=y                                    # enable I2C subsystem

# Built-in status screen (layer name + battery + BLE output)
# Set to CUSTOM if you write your own screen later
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Run UI updates on the system thread (saves ~2 KB RAM vs dedicated thread)
# Switch to DEDICATED if you notice key-scan lag
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y

# Blank OLED when idle (auto-enabled for SSD1306, explicit here for clarity)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ── Built-in widgets ─────────────────────────────────────────────────────────
CONFIG_ZMK_WIDGET_LAYER_STATUS=y                # shows active layer name
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y              # battery level icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y   # show % instead of icon
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y               # USB / BLE indicator
# CONFIG_ZMK_WIDGET_WPM_STATUS is not set       # leave off to save space

# ── RAM: give LVGL enough heap ────────────────────────────────────────────────
# The SSD1306 + LVGL needs a small heap; 8 KB is safe for 128×32
CONFIG_HEAP_MEM_POOL_SIZE=8192
