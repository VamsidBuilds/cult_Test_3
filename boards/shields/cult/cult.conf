# OLED Display (SSD1306 128×32 via I2C)
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y

# Critical: Set correct screen buffer size for 128x32
CONFIG_SSD1306_REVERSE_MODE=n
CONFIG_SSD1306_VIDEO_RAM_SIZE=512  # 128*32/8 = 512 bytes

# Improve display refresh
CONFIG_LVGL_REFR_PERIOD=30          # Refresh every 30ms
CONFIG_LVGL_DISP_BUF_NUM=1          # Single buffer to save RAM
CONFIG_LVGL_DISP_DOUBLE_BUF=n       # No double buffering for small OLED

# Keep your existing settings
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
